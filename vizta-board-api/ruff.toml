target-version = "py312"
line-length = 100
indent-width = 4

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "DJ",  # flake8-django
    "T20", # flake8-print
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in default args
    "DJ001",  # avoid null=True on string-based fields (we need it in some cases)
]
fixable = ["I", "UP", "C4"]
unfixable = []

[lint.per-file-ignores]
"*/migrations/*.py" = ["E501", "F401"]
"*/settings/*.py" = ["F405", "F403"]
"manage.py" = ["T20"]

[lint.isort]
known-first-party = ["apps", "core", "config"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
