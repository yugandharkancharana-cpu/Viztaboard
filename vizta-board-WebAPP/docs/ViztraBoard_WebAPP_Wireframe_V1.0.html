<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Vizta Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.1/feather.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
/* ═══════════════════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════════════════ */
:root {
  --green:        #1B7A3E;
  --green-dk:     #145E30;
  --green-lt:     #D6EFE0;
  --green-xl:     #F1F8F4;
  --green-bg:     #E2F0E9;
  --sidebar-bg:   #0F3D20;
  --dark:         #1A1A1A;
  --mid:          #3D3D3D;
  --muted:        #6B6B6B;
  --border:       #E5E7EB;
  --white:        #FFFFFF;
  --off:          #F9FAFB;
  --success:      #16A34A; --success-bg: #DCFCE7;
  --warn:         #D97706; --warn-bg:    #FEF3C7;
  --error:        #DC2626; --error-bg:   #FEE2E2;
  --info:         #2563EB; --info-bg:    #DBEAFE;

  --bg:      var(--white);
  --surface: var(--off);
  --fg:      var(--dark);
  --fg2:     var(--mid);
  --fg3:     var(--muted);
  --bdr:     var(--border);

  --sw: 240px;   /* sidebar width */
  --th: 60px;    /* topbar height */
  --r:  12px;    /* card radius */

  --sh-card:  0 1px 3px rgba(0,0,0,.07), 0 2px 10px rgba(0,0,0,.05);
  --sh-modal: 0 8px 40px rgba(0,0,0,.14), 0 2px 8px rgba(0,0,0,.08);
  --sh-drawer:−12px 0 40px rgba(0,0,0,.12);

  --font-d: 'Nunito', sans-serif;
  --font-b: 'Inter', system-ui, sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:       #0D1410; --surface:   #141C18;
    --fg:       #EDF3EF; --fg2:       #C4D5CB; --fg3: #7DA690;
    --bdr:      #243020;
    --green:    #2EAA5A; --green-dk:  #3DC46A;
    --green-lt: #1B3526; --green-xl:  #121E16; --green-bg: #162B1E;
    --off:      #141C18;
    --sidebar-bg: #071409;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:       #0D1410; --surface:   #141C18;
  --fg:       #EDF3EF; --fg2:       #C4D5CB; --fg3: #7DA690;
  --bdr:      #243020;
  --green:    #2EAA5A; --green-dk:  #3DC46A;
  --green-lt: #1B3526; --green-xl:  #121E16; --green-bg: #162B1E;
  --off:      #141C18;
  --sidebar-bg: #071409;
  color-scheme: dark;
}

/* ═══════════════════════════════════════════════════════
   RESET + BASE
═══════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-b); font-size: 14px; line-height: 1.5;
}
a { color: var(--green); text-decoration: none; }
img { max-width: 100%; }
button { cursor: pointer; font-family: var(--font-b); }

/* ═══════════════════════════════════════════════════════
   ROLE SELECTOR (landing)
═══════════════════════════════════════════════════════ */
.role-screen {
  min-height: 100vh; background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.role-card {
  background: var(--bg); border-radius: 20px;
  box-shadow: var(--sh-modal); padding: 48px;
  max-width: 520px; width: 100%; text-align: center;
}
.role-logo {
  display: inline-flex; align-items: center; gap: 10px;
  margin-bottom: 8px;
}
.role-logo-mark {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--green); display: flex; align-items: center; justify-content: center;
}
.role-logo-mark span { color: #fff; font-family: var(--font-d); font-weight: 900; font-size: 18px; }
.role-logo-text { font-family: var(--font-d); font-weight: 900; font-size: 22px; color: var(--fg); }
.role-tagline { font-size: 13px; color: var(--fg3); margin: 0 0 36px; }
.role-heading { font-family: var(--font-d); font-size: 20px; font-weight: 800; color: var(--fg); margin: 0 0 6px; }
.role-sub { font-size: 13px; color: var(--fg3); margin: 0 0 28px; }
.role-options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
.role-option {
  border: 2px solid var(--bdr); border-radius: 14px;
  padding: 22px 18px; cursor: pointer; transition: all .18s;
  background: var(--surface); text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.role-option:hover { border-color: var(--green); background: var(--green-xl); }
.role-option.selected { border-color: var(--green); background: var(--green-xl); }
.role-option-icon {
  width: 48px; height: 48px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center; font-size: 24px;
}
.role-option-name { font-weight: 700; font-size: 14px; color: var(--fg); }
.role-option-desc { font-size: 12px; color: var(--fg3); line-height: 1.4; }
.role-footer { font-size: 12px; color: var(--fg3); }

/* ═══════════════════════════════════════════════════════
   APP SHELL
═══════════════════════════════════════════════════════ */
.shell {
  display: flex; min-height: 100vh;
}

/* ── Sidebar ── */
.sidebar {
  width: var(--sw); flex-shrink: 0; background: var(--sidebar-bg);
  display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
}
.sidebar-logo {
  padding: 20px 20px 16px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.sidebar-logo-mark {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--green); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.sidebar-logo-mark span { color: #fff; font-family: var(--font-d); font-weight: 900; font-size: 15px; }
.sidebar-logo-text { font-family: var(--font-d); font-weight: 900; font-size: 16px; color: #fff; }
.sidebar-role-badge {
  font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  background: rgba(255,255,255,.12); color: rgba(255,255,255,.7);
  border-radius: 100px; padding: 2px 8px; margin-left: auto; flex-shrink: 0;
}
.sidebar-nav { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.nav-section-label {
  font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: rgba(255,255,255,.35); padding: 10px 8px 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 9px; cursor: pointer;
  color: rgba(255,255,255,.6); font-size: 13px; font-weight: 500;
  transition: all .15s; border: none; background: none; width: 100%; text-align: left;
}
.nav-item:hover { background: rgba(255,255,255,.07); color: rgba(255,255,255,.9); }
.nav-item.active { background: rgba(255,255,255,.12); color: #fff; }
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
.nav-badge {
  margin-left: auto; background: var(--error); color: #fff;
  font-size: 10px; font-weight: 700; border-radius: 100px; padding: 1px 6px; min-width: 18px; text-align: center;
}
.sidebar-user {
  padding: 14px 14px 14px; border-top: 1px solid rgba(255,255,255,.08);
  display: flex; align-items: center; gap: 10px;
}
.sidebar-avatar {
  width: 34px; height: 34px; border-radius: 50%; background: var(--green);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-d); font-weight: 800; font-size: 13px; color: #fff; flex-shrink: 0;
}
.sidebar-user-info { flex: 1; min-width: 0; }
.sidebar-user-name { font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-user-role { font-size: 11px; color: rgba(255,255,255,.5); }
.sidebar-logout { background: none; border: none; cursor: pointer; color: rgba(255,255,255,.4); padding: 4px; transition: color .15s; }
.sidebar-logout:hover { color: rgba(255,255,255,.8); }
.sidebar-logout svg { width: 15px; height: 15px; display: block; }

/* ── Main ── */
.main { margin-left: var(--sw); flex: 1; display: flex; flex-direction: column; min-height: 100vh; min-width: 0; }

/* ── Topbar ── */
.topbar {
  height: var(--th); background: var(--bg); border-bottom: 1px solid var(--bdr);
  display: flex; align-items: center; padding: 0 28px; gap: 16px;
  position: sticky; top: 0; z-index: 50;
}
.topbar-title { font-family: var(--font-d); font-size: 18px; font-weight: 800; color: var(--fg); flex: 1; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }

/* ── Content ── */
.content { flex: 1; padding: 28px; background: var(--surface); }

/* ═══════════════════════════════════════════════════════
   COMMON COMPONENTS
═══════════════════════════════════════════════════════ */

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 16px; border-radius: 9px; font-size: 13px; font-weight: 600;
  border: none; transition: all .15s; white-space: nowrap;
}
.btn svg { width: 14px; height: 14px; }
.btn-primary { background: var(--green); color: #fff; }
.btn-primary:hover { background: var(--green-dk); }
.btn-outline { background: transparent; color: var(--green); border: 1.5px solid var(--green); }
.btn-outline:hover { background: var(--green-xl); }
.btn-ghost { background: transparent; color: var(--fg3); border: 1.5px solid var(--bdr); }
.btn-ghost:hover { background: var(--surface); color: var(--fg); }
.btn-danger { background: transparent; color: var(--error); border: 1.5px solid var(--error); }
.btn-danger:hover { background: var(--error-bg); }
.btn-success { background: var(--green); color: #fff; }
.btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 7px; }
.btn-lg { padding: 11px 24px; font-size: 14px; border-radius: 11px; }

/* Status pills */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 100px; font-size: 11px; font-weight: 600; white-space: nowrap;
}
.pill::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.pill-active       { background: var(--success-bg); color: var(--success); }
.pill-pending      { background: var(--warn-bg);    color: var(--warn); }
.pill-approved     { background: var(--green-lt);   color: var(--green-dk); }
.pill-rejected     { background: var(--error-bg);   color: var(--error); }
.pill-completed    { background: var(--surface);     color: var(--fg3); border: 1px solid var(--bdr); }
.pill-draft        { background: var(--info-bg);    color: var(--info); }
.pill-digital      { background: var(--info-bg);    color: var(--info); }

/* KPI tiles */
.kpi-row { display: grid; gap: 16px; }
.kpi-tile {
  background: var(--bg); border: 1px solid var(--bdr); border-radius: var(--r);
  padding: 20px 22px; display: flex; flex-direction: column; gap: 4px;
}
.kpi-label { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--fg3); }
.kpi-value { font-family: var(--font-d); font-size: 28px; font-weight: 800; color: var(--fg); line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi-sub { font-size: 12px; color: var(--fg3); }
.kpi-accent { color: var(--green); }
.kpi-warn   { color: var(--warn); }
.kpi-error  { color: var(--error); }

/* Cards */
.card {
  background: var(--bg); border: 1px solid var(--bdr); border-radius: var(--r);
  box-shadow: var(--sh-card);
}

/* Search */
.search-bar {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border: 1.5px solid var(--bdr); border-radius: 10px;
  padding: 0 12px; transition: border-color .15s;
}
.search-bar:focus-within { border-color: var(--green); }
.search-bar svg { color: var(--fg3); width: 15px; height: 15px; flex-shrink: 0; }
.search-bar input {
  flex: 1; border: none; background: transparent; outline: none;
  font-family: var(--font-b); font-size: 13px; color: var(--fg); padding: 9px 0;
}
.search-bar input::placeholder { color: var(--fg3); }

/* Filter chips */
.filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 5px 12px; border-radius: 100px; font-size: 12px; font-weight: 600; cursor: pointer;
  border: 1.5px solid var(--bdr); background: var(--bg); color: var(--fg3); transition: all .15s;
}
.chip:hover { border-color: var(--green); color: var(--green); }
.chip.active { border-color: var(--green); background: var(--green-xl); color: var(--green); }

/* Section heads */
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.section-head h3 { font-family: var(--font-d); font-size: 15px; font-weight: 800; color: var(--fg); margin: 0; }

/* ═══════════════════════════════════════════════════════
   BROWSE / BILLBOARD GRID
═══════════════════════════════════════════════════════ */
.browse-toolbar {
  display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
}
.browse-toolbar .search-bar { flex: 1; min-width: 220px; }

.bb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }

.bb-card {
  background: var(--bg); border: 1px solid var(--bdr); border-radius: 14px;
  overflow: hidden; cursor: pointer; transition: transform .18s, box-shadow .18s;
}
.bb-card:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(0,0,0,.12); }

.bb-thumb {
  height: 160px; display: flex; align-items: flex-end; justify-content: flex-start;
  padding: 12px; position: relative;
}
.bb-format-badge {
  font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  background: rgba(0,0,0,.5); color: #fff; backdrop-filter: blur(4px);
  border-radius: 6px; padding: 3px 8px;
}
.bb-digital-badge {
  position: absolute; top: 12px; right: 12px;
  background: rgba(37,99,235,.85); color: #fff; font-size: 10px; font-weight: 700;
  border-radius: 6px; padding: 3px 8px; backdrop-filter: blur(4px);
}
.bb-body { padding: 16px; }
.bb-title { font-family: var(--font-d); font-size: 15px; font-weight: 800; color: var(--fg); margin: 0 0 4px; }
.bb-loc { font-size: 12px; color: var(--fg3); display: flex; align-items: center; gap: 4px; margin-bottom: 12px; }
.bb-loc svg { width: 12px; height: 12px; }
.bb-specs { display: flex; gap: 14px; margin-bottom: 14px; }
.bb-spec { display: flex; flex-direction: column; gap: 1px; }
.bb-spec-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--fg3); }
.bb-spec-val { font-size: 12px; font-weight: 600; color: var(--fg); }
.bb-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--bdr); }
.bb-rate { font-family: var(--font-d); font-size: 17px; font-weight: 800; color: var(--green); }
.bb-rate span { font-size: 12px; font-weight: 500; color: var(--fg3); }
.bb-views { font-size: 11px; color: var(--fg3); display: flex; align-items: center; gap: 4px; }
.bb-views svg { width: 12px; height: 12px; }

/* ═══════════════════════════════════════════════════════
   DETAIL DRAWER
═══════════════════════════════════════════════════════ */
.drawer-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 200;
  display: flex; justify-content: flex-end; backdrop-filter: blur(2px);
}
.drawer {
  width: 520px; max-width: 94vw; background: var(--bg);
  height: 100%; overflow-y: auto; display: flex; flex-direction: column;
  box-shadow: var(--sh-modal);
}
.drawer-hero { height: 220px; position: relative; flex-shrink: 0; }
.drawer-close {
  position: absolute; top: 14px; left: 14px;
  background: rgba(0,0,0,.4); border: none; color: #fff; cursor: pointer;
  width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px); transition: background .15s;
}
.drawer-close:hover { background: rgba(0,0,0,.65); }
.drawer-close svg { width: 16px; height: 16px; }
.drawer-body { padding: 24px; flex: 1; display: flex; flex-direction: column; gap: 20px; }
.drawer-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.drawer-title { font-family: var(--font-d); font-size: 20px; font-weight: 900; color: var(--fg); margin: 0; }
.drawer-loc { font-size: 13px; color: var(--fg3); display: flex; align-items: center; gap: 5px; margin-top: 4px; }
.drawer-loc svg { width: 13px; height: 13px; }

.specs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.spec-box {
  background: var(--green-xl); border-radius: 10px; padding: 12px 14px;
  display: flex; flex-direction: column; gap: 3px;
}
.spec-box .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--green-dk); }
.spec-box .val { font-size: 13px; font-weight: 700; color: var(--fg); }

.drawer-desc { font-size: 13px; color: var(--fg2); line-height: 1.65; }
.drawer-audience { background: var(--surface); border-radius: 10px; padding: 14px 16px; font-size: 13px; color: var(--fg2); }
.drawer-audience strong { color: var(--fg); }

.drawer-footer {
  padding: 18px 24px; border-top: 1px solid var(--bdr); flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between; background: var(--bg);
  position: sticky; bottom: 0;
}
.drawer-rate { font-family: var(--font-d); font-size: 22px; font-weight: 900; color: var(--green); }
.drawer-rate span { font-size: 13px; font-weight: 500; color: var(--fg3); }

/* ═══════════════════════════════════════════════════════
   BOOKING OVERLAY
═══════════════════════════════════════════════════════ */
.booking-overlay {
  position: fixed; inset: 0; background: var(--bg); z-index: 300;
  display: flex; flex-direction: column;
}
.booking-header {
  height: var(--th); background: var(--bg); border-bottom: 1px solid var(--bdr);
  display: flex; align-items: center; padding: 0 28px; gap: 16px; flex-shrink: 0;
}
.booking-back { background: none; border: none; color: var(--green); cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.booking-back svg { width: 15px; height: 15px; }
.booking-title { font-family: var(--font-d); font-size: 16px; font-weight: 800; color: var(--fg); }
.booking-steps-bar {
  display: flex; align-items: center; gap: 0; padding: 0 28px; margin-left: auto;
}
.booking-step-item { display: flex; align-items: center; gap: 7px; }
.step-circle {
  width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--bdr);
  display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
  background: var(--bg); color: var(--fg3); transition: all .2s;
}
.step-circle.done { background: var(--green); border-color: var(--green); color: #fff; }
.step-circle.active { border-color: var(--green); color: var(--green); }
.step-label { font-size: 12px; font-weight: 500; color: var(--fg3); }
.step-label.active { color: var(--green); font-weight: 600; }
.step-label.done { color: var(--fg2); }
.step-connector { width: 32px; height: 2px; background: var(--bdr); margin: 0 8px; }
.step-connector.done { background: var(--green); }

.booking-body { flex: 1; overflow-y: auto; padding: 32px; display: flex; gap: 32px; align-items: flex-start; }
.booking-left { flex: 1; min-width: 0; }
.booking-right { width: 300px; flex-shrink: 0; }

/* Calendar */
.cal-month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.cal-month-nav h4 { font-family: var(--font-d); font-size: 15px; font-weight: 800; margin: 0; color: var(--fg); }
.cal-nav-btn { background: none; border: 1.5px solid var(--bdr); border-radius: 7px; color: var(--fg3); cursor: pointer; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
.cal-nav-btn:hover { border-color: var(--green); color: var(--green); }
.cal-nav-btn svg { width: 14px; height: 14px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-hdr { text-align: center; font-size: 11px; font-weight: 600; color: var(--fg3); padding: 4px 0 8px; }
.cal-day {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border-radius: 8px; font-size: 13px; cursor: pointer; transition: all .12s;
  color: var(--fg); user-select: none;
}

function renderCalendar() {
  const { bCalYear:y, bCalMonth:m, bStart, bEnd } = S;
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = toDateStr(today);
  const firstDow = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();

  let html = `<div class="cal-grid">`;
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d => { html += `<div class="cal-hdr">${d}</div>`; });
  for (let i = 0; i < firstDow; i++) html += `<div class="cal-day empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${y}-${padZero(m+1)}-${padZero(d)}`;
    const isPast = dateStr < todayStr;
    const isStart = dateStr === bStart;
    const isEnd   = dateStr === bEnd;
    const inRange = bStart && bEnd && dateStr > bStart && dateStr < bEnd;
    let cls = 'cal-day';
    if (isPast) cls += ' past';
    if (inRange) cls += ' in-range';
    if (isStart) cls += ' sel-start';
    if (isEnd)   cls += ' sel-end';
    const attrs = !isPast ? `data-action="pick-day" data-date="${dateStr}"` : '';
    html += `<div class="${cls}" ${attrs}>${d}</div>`;
  }
  return html + '</div>';
}

function calcBookingCost(b) {
  if (!S.bStart || !S.bEnd) return null;
  const days = Math.round((new Date(S.bEnd) - new Date(S.bStart)) / 86400000) + 1;
  const subtotal = days * b.rate;
  const fee = Math.round(subtotal * 0.12);
  return { days, subtotal, fee, total: subtotal + fee };
}

function initChart() {
  if (S.chart) { S.chart.destroy(); S.chart = null; }
  const canvas = document.getElementById('analyticsChart');
  if (!canvas) return;
  const camp = CAMPAIGNS.find(c => c.id === S.analyticsId) || CAMPAIGNS[0];
  const labels = Array.from({length:30},(_,i) => { const d = new Date('2026-09-14'); d.setDate(d.getDate()+i); return `${d.getMonth()+1}/${d.getDate()}`; });
  const base = Math.round(camp.impressions / 30);
  const data  = labels.map(() => Math.max(0, base + Math.round((Math.random()-.45) * base * .6)));
  const isDark = document.documentElement.dataset.theme === 'dark' || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const gridColor = isDark ? 'rgba(255,255,255,.07)' : 'rgba(0,0,0,.06)';
  const textColor = isDark ? '#7DA690' : '#6B6B6B';
  S.chart = new Chart(canvas, {
    type: 'bar',
    data: { labels, datasets: [{ label:'Impressions', data, backgroundColor:'rgba(27,122,62,.7)', borderRadius:4 }] },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label: ctx => ' '+fmtNum(ctx.raw)+' impressions' } } },
      scales: {
        x:{ ticks:{ color:textColor, font:{size:11}, maxTicksLimit:10 }, grid:{ color:gridColor } },
        y:{ ticks:{ color:textColor, font:{size:11}, callback: v => fmtNum(v) }, grid:{ color:gridColor } }
      }
    }
  });
}

          <div class="menu-group-label">Support</div>
          <div class="menu-row"><i data-feather="help-circle"></i><span class="menu-row-label">Help Center</span><span class="menu-row-arrow"><i data-feather="chevron-right"></i></span></div>
          <div class="menu-row"><i data-feather="message-circle"></i><span class="menu-row-label">Contact Support</span><span class="menu-row-arrow"><i data-feather="chevron-right"></i></span></div>

  `;
}

/* ═══════════════════════════════════════════════════════
   VIEW: OWNER DASHBOARD
═══════════════════════════════════════════════════════ */
function renderOwnerDashboard() {
  const st = OWNER.stats;
  const kpis = `
    <div class="kpi-row" style="grid-template-columns:repeat(5,1fr);margin-bottom:28px">
      <div class="kpi-tile"><div class="kpi-label">Total Billboards</div><div class="kpi-value">${st.total}</div><div class="kpi-sub">${st.active} active</div></div>
      <div class="kpi-tile"><div class="kpi-label">Pending Approval</div><div class="kpi-value kpi-warn">${S.pending.length}</div><div class="kpi-sub">Awaiting action</div></div>
      <div class="kpi-tile"><div class="kpi-label">Oct Net Earnings</div><div class="kpi-value kpi-accent">${fmtMoney(st.monthlyNet)}</div><div class="kpi-sub">After 12% commission</div></div>
      <div class="kpi-tile"><div class="kpi-label">Occupancy</div><div class="kpi-value">${st.occupancy}%</div><div class="kpi-sub">Active boards</div></div>
      <div class="kpi-tile"><div class="kpi-label">Paid Out</div><div class="kpi-value">${fmtMoney(OWNER.earnings.paid)}</div><div class="kpi-sub">This month</div></div>
    </div>
  `;

  const pendingHtml = S.pending.length ? S.pending.map(p => `
    <div class="pending-card" id="pending-${p.id}">
      <div class="pending-info">
        <div class="pending-advertiser">${p.advertiser} · <span class="pill ${p.type==='instant'?'pill-active':'pill-pending'}" style="font-size:10px">${p.type==='instant'?'Instant':'Request'}</span></div>
        <div class="pending-billboard">${p.billboard}</div>
        <div class="pending-dates">
          <span><i data-feather="calendar"></i> ${p.start} – ${p.end}</span>
          <span><i data-feather="clock"></i> ${p.days} days</span>
        </div>
      </div>
      <div class="pending-amount">${fmtMoney(p.amount)}<span>gross</span></div>
      <div class="pending-actions">
        <button class="btn btn-success btn-sm" data-action="approve-booking" data-id="${p.id}"><i data-feather="check"></i> Approve</button>
        <button class="btn btn-danger btn-sm"  data-action="reject-booking"  data-id="${p.id}"><i data-feather="x"></i> Reject</button>
      </div>
    </div>
  `).join('') : `<div class="empty-state"><div class="empty-icon">🎉</div><div class="empty-title">All caught up!</div><div class="empty-sub">No pending booking requests right now</div></div>`;

  const earn = OWNER.earnings;
  const earningsHtml = `
    <div class="earnings-breakdown">
      <div class="earnings-row"><span class="earnings-label">Gross revenue</span><span class="earnings-val">${fmtMoney(earn.gross)}</span></div>
      <div class="earnings-row"><span class="earnings-label">Platform commission (12%)</span><span class="earnings-val earnings-neg">− ${fmtMoney(earn.commission)}</span></div>
      <div class="earnings-row"><span class="earnings-label">Net earnings</span><span class="earnings-val earnings-pos">${fmtMoney(earn.net)}</span></div>
      <div class="earnings-row"><span class="earnings-label">Pending payout</span><span class="earnings-val">${fmtMoney(earn.pending)}</span></div>
      <div class="earnings-row"><span class="earnings-label">Paid out (Oct)</span><span class="earnings-val earnings-pos">${fmtMoney(earn.paid)}</span></div>
    </div>
  `;

  return `
    ${kpis}
    <div style="display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start">
      <div>
        <div class="section-head"><h3>Pending Bookings (${S.pending.length})</h3></div>
        <div class="pending-list">${pendingHtml}</div>
      </div>
      <div>
        <div class="section-head"><h3>October Earnings</h3></div>
        ${earningsHtml}
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════
   ROLE SELECTOR
═══════════════════════════════════════════════════════ */

  return `
    <div class="role-screen">
      <div class="role-card">
        <div class="role-logo">
          <div class="role-logo-mark"><span>VB</span></div>
          <span class="role-logo-text">Vizta Board</span>
        </div>
        <p class="role-tagline">Africa's Billboard Marketplace</p>
        <h2 class="role-heading">Continue as…</h2>
        <p class="role-sub">Select your role to enter the platform</p>

          <div class="role-option" data-action="set-role" data-role="advertiser">

/* ═══════════════════════════════════════════════════════
   MASTER RENDER
═══════════════════════════════════════════════════════ */
const PAGE_TITLES = {
  browse:'Browse Billboards', campaigns:'Campaigns', analytics:'Analytics',
  notifications:'Notifications', profile:'Profile', dashboard:'Dashboard',
};

function render() {
  const root = document.getElementById('root');

  if (!S.role) {
    root.innerHTML = renderRoleSelector();
    feather.replace();
    bindEvents();
    return;
  }

  // Booking overlay takes full screen
  if (S.bookingId !== null) {
    root.innerHTML = renderBookingOverlay();
    feather.replace();
    bindEvents();
    return;
  }

  const title = PAGE_TITLES[S.view] || '';
  const extraActions = S.view === 'browse' ? `
    <button class="btn btn-ghost btn-sm"><i data-feather="sliders"></i> Filters</button>
  ` : S.view === 'analytics' ? `
    <button class="btn btn-outline btn-sm"><i data-feather="download"></i> Export PDF</button>
  ` : '';

  let viewHtml = '';
  switch (S.view) {
    case 'browse':        viewHtml = renderBrowse(); break;
    case 'campaigns':     viewHtml = renderCampaigns(); break;
    case 'analytics':     viewHtml = renderAnalytics(); break;
    case 'notifications': viewHtml = renderNotifications(); break;
    case 'profile':       viewHtml = renderProfile(); break;
    case 'dashboard':     viewHtml = renderOwnerDashboard(); break;
    default:              viewHtml = renderBrowse();
  }

  root.innerHTML = `
    ${renderSidebar()}
    <div class="main">
      ${renderTopbar(title, extraActions)}
      <div class="content">${viewHtml}</div>
    </div>
    ${S.detailId !== null ? renderDetailDrawer(S.detailId) : ''}
  `;

  feather.replace();
  if (S.view === 'analytics') requestAnimationFrame(initChart);
  bindEvents();
}

/* ═══════════════════════════════════════════════════════
   EVENTS
═══════════════════════════════════════════════════════ */
function bindEvents() {
  const root = document.getElementById('root');
  root.removeEventListener('click', handleClick);
  root.addEventListener('click', handleClick);

  const si = document.getElementById('searchInput');
  if (si) {
    si.removeEventListener('input', handleSearch);
    si.addEventListener('input', handleSearch);
  }
}

function handleSearch(e) {
  S.searchQ = e.target.value;
  const grid = document.querySelector('.bb-grid');
  if (grid) {
    grid.innerHTML = renderBrowse().match(/<div class="bb-grid">([\s\S]*)<\/div>$/)?.[1] || '';
    // Simple approach: just re-render the whole content area
    document.querySelector('.content').innerHTML = renderBrowse();
    feather.replace();
    const si = document.getElementById('searchInput');
    if (si) { si.focus(); si.setSelectionRange(si.value.length, si.value.length); si.addEventListener('input', handleSearch); }
  }
}

function handleClick(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const id     = el.dataset.id ? Number(el.dataset.id) : null;
  const val    = el.dataset.val;
  const view   = el.dataset.view;
  const role   = el.dataset.role;
  const date   = el.dataset.date;

  switch (action) {
    case 'set-role':
      S.role = role;
      S.view = role === 'advertiser' ? 'browse' : 'dashboard';
      render(); break;

    case 'logout':
      S.role = null; S.detailId = null; S.bookingId = null;
      render(); break;

    case 'nav':
      S.view = view;
      if (S.view !== 'analytics' && S.chart) { S.chart.destroy(); S.chart = null; }
      render(); break;

    case 'open-detail':
      S.detailId = id; render(); break;

    case 'close-detail':
      S.detailId = null; render(); break;

    case 'start-booking':
      S.bookingId = id; S.bStep = 1; S.bStart = null; S.bEnd = null; S.bType = 'instant';
      S.detailId = null;
      render(); break;

    case 'close-booking':
      S.bookingId = null; S.bStep = 1;
      S.view = S.bStep === 4 ? 'campaigns' : S.view;
      render(); break;

    case 'booking-back':
      if (S.bStep === 1) { S.bookingId = null; S.detailId = S.bookingId; render(); }
      else { S.bStep--; render(); }
      break;

    case 'booking-next':
      S.bStep = Math.min(4, S.bStep + 1);
      if (S.bStep === 4) toast('Booking submitted!', 'success');
      render(); break;

    case 'btype':
      S.bType = val; render(); break;

    case 'cal-prev':
      S.bCalMonth--; if (S.bCalMonth < 0) { S.bCalMonth = 11; S.bCalYear--; }
      render(); break;

    case 'cal-next':
      S.bCalMonth++; if (S.bCalMonth > 11) { S.bCalMonth = 0; S.bCalYear++; }
      render(); break;

    case 'pick-day':
      if (!S.bStart || (S.bStart && S.bEnd)) {
        S.bStart = date; S.bEnd = null;
      } else if (date > S.bStart) {
        S.bEnd = date;
      } else {
        S.bStart = date; S.bEnd = null;
      }
      render(); break;

    case 'format':
      S.formatFilter = val; render(); break;

    case 'camp-filter':
      S.campFilter = val; render(); break;

    case 'analytics-camp':
      S.analyticsId = id;
      if (S.chart) { S.chart.destroy(); S.chart = null; }
      render(); break;

    case 'mark-read':
      S.notifs = S.notifs.map(n => n.id === id ? {...n, read:true} : n);
      render(); break;

    case 'mark-all-read':
      S.notifs = S.notifs.map(n => ({...n, read:true}));
      render(); break;

    case 'approve-booking':
      S.pending = S.pending.filter(p => p.id !== id);
      toast('Booking approved — advertiser notified ✓', 'success');
      render(); break;

    case 'reject-booking':
      S.pending = S.pending.filter(p => p.id !== id);
      toast('Booking rejected and removed', 'error');
      render(); break;
  }
}

/* ═══════════════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════════════ */
function toast(msg, type='') {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = `toast ${type === 'success' ? 'toast-success' : type === 'error' ? 'toast-error' : ''}`;
  t.innerHTML = `<i data-feather="${type==='success'?'check-circle':type==='error'?'x-circle':'info'}"></i> ${msg}`;
  c.appendChild(t);
  feather.replace();
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(()=>t.remove(), 300); }, 3000);
}

/* ═══════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════ */
render();
</script>
